name: CI-CD
on:
  push:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r A1/requirements.txt pytest
      - run: pytest -v A3/tests
  build:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            utsb/st127120-car-price:latest
            utsb/st127120-car-price:${{ github.sha }}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install sshpass and the SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
      - name: Copy compose file to ml-brain and restart the app
        env:
          SSHPASS: ${{ secrets.BAZOOKA_PASSWORD }}
        run: |
          NOCHECK="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          JUMP="ProxyCommand=sshpass -e ssh $NOCHECK -o PubkeyAuthentication=no -W %h:%p st127120@bazooka.cs.ait.ac.th"
          SERVER=st127120@ml.brain.cs.ait.ac.th
          scp $NOCHECK -i $HOME/.ssh/id_deploy -o "$JUMP" docker-compose.server.yaml $SERVER:car-price/
          ssh $NOCHECK -i $HOME/.ssh/id_deploy -o "$JUMP" $SERVER '
            cd ~/car-price &&
            docker compose -f docker-compose.server.yaml pull &&
            (docker compose -f docker-compose.yaml down || true) &&
            docker compose -f docker-compose.server.yaml up -d &&
            docker ps --filter name=car-price'
